name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
    steps:
      # Actions are pinned to full commit SHAs. Dependabot proposes updates.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
      - name: Unit and golden tests
        run: npm test
      - name: Independent Python cross-check
        run: python3 test/golden/reference.py
      - name: Build
        run: npm run build
      - name: Committed page matches the source
        run: git diff --exit-code dist/
